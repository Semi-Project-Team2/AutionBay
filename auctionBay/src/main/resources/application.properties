spring.application.name=autionbay

server.port=8123

# secret 프로파일 포함 (application-secret.properties 로드)
#spring.profiles.include=secret


spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=C##AUCTIONBAY
spring.datasource.password=AUCTIONBAY
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver



#마이 바티스 
# MyBatis 설정 (mappers 폴더 지정 및 카멜케이스 변환)
mybatis.mapper-locations=classpath*:mappers/**/*.xml

mybatis.configuration.jdbc-type-for-null=NULL
mybatis.configuration.map-underscore-to-camel-case=true

# 파일 업로드 설정
#  업로드 파일 1개 최대 크기
spring.servlet.multipart.max-file-size=100MB
#  업로드 요청의 최대 크기
spring.servlet.multipart.max-request-size=500MB

# 파일 업로드 경로 설정
file.upload-dir=uploads
file.upload-dir.profile=uploads/profile
file.upload-dir.board=uploads/board
file.upload-dir.product=uploads/product


mybatis.type-aliases-package=com.kh.auctionBay.**.dto

